<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ</title><style>
body{font-family:Arial;background:#f4f4f4;padding:25px}.faq{max-width:650px;margin:auto}.question{background:#26345d;color:white;padding:15px;cursor:pointer;margin-top:8px}.answer{display:none;background:white;padding:15px}.answer.show{display:block}
</style></head><body><div class="faq"><h1>Frequently Asked Questions</h1><div class="question">What is HTML?</div><div class="answer">HTML is used to create the structure of web pages.</div><div class="question">What is CSS?</div><div class="answer">CSS is used to style web pages.</div><div class="question">What is JavaScript?</div><div class="answer">JavaScript adds interactivity to web pages.</div></div><script>
document.querySelectorAll(".question").forEach(q=>q.onclick=function(){this.nextElementSibling.classList.toggle("show")});
</script></body></html>
