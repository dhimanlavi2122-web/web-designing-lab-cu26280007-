<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Pricing Plans</title>
        <style>
            body{font-family:Arial;background:#f3f5fa;text-align:center;padding:25px}
            .plans{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
            .card{background:white;border:2px solid #ddd;border-radius:12px;padding:25px;width:220px;transition:.3s}
            .card:hover{transform:translateY(-8px);box-shadow:0 8px 20px #bbb}
            .popular{border-color:#2878d0}
            .price{font-size:28px;color:#2878d0}
        </style>
    </head>
    <body>
        <h1>Our Pricing</h1>
        <div class="plans">
            <div class="card">
                <h2>Basic</h2>
                <p class="price">₹199</p>
                <p>Basic features</p>
            </div>
            <div class="card popular">
                <h2>Popular</h2>
                <p class="price">₹499</p>
                <p>All standard features</p>
                <b>Most Popular</b>
            </div>
            <div class="card">
                <h2>Premium</h2>
                <p class="price">₹999</p>
                <p>All features</p>
            </div>
        </div>
    </body>
</html>
