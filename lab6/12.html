<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Social Footer</title>
        <style>
            body {
                font-family: Arial;
                min-height: 90vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                margin: 0;
                text-align: center;
            }
            footer {
                background: #26345d;
                color: white;
                padding: 30px;
            }
            .social {
                display: flex;
                justify-content: center;
                gap: 18px;
                flex-wrap: wrap;
            }
            .social a {
                color: white;
                text-decoration: none;
                padding: 10px;
                border: 1px solid white;
                border-radius: 6px;
                transition: .3s;
            }
            .social a:hover {
                background: #ffb703;
                color: #222;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to My Website</h1>
        <footer>
            <h2>Follow Us</h2>
            <div class="social">
                <a href="https://facebook.com">Facebook</a>
                <a href="https://instagram.com">Instagram</a>
                <a href="https://linkedin.com">LinkedIn</a>
            </div>
            <p>© 2026 My Website</p>
        </footer>
    </body>
</html>
