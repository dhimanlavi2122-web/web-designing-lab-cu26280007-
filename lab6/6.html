<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Contact Form</title>
        <style>
            body{font-family:Arial;background:#eef2f7;padding:25px}
            .form{max-width:420px;margin:auto;background:white;padding:25px;border-radius:10px}
            input,textarea{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
            button{padding:10px 20px;background:#26345d;color:white;border:0}
            #msg{color:green}
        </style>
    </head>
    <body>
        <form class="form" id="contact">
            <h2>Contact Us</h2>
            <input id="name" placeholder="Your name">
            <input id="email" placeholder="Email">
            <textarea id="message" placeholder="Message"></textarea>
            <button>Submit</button>
            <p id="msg"></p>
        </form>
        <script>
            document.getElementById("contact").addEventListener("submit",function(e){
                e.preventDefault();
                let n=name.value.trim(),
                    em=email.value.trim(),
                    m=message.value.trim();
                if(!n||!em||!m){
                    msg.style.color="red";
                    msg.textContent="Please fill all fields.";
                    return;
                }
                if(!/^[^ ]+@[^ ]+\\.[^ ]+$/.test(em)){
                    msg.style.color="red";
                    msg.textContent="Enter a valid email.";
                    return;
                }
                msg.style.color="green";
                msg.textContent="Form submitted successfully!";
            });
        </script>
    </body>
</html>
