<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
         content="width=device-width,
         initial-scale=1">
         <title>Photo Gallery</title>
    <style>
       body{font-family:Arial;
       text-align:center;
       background:#f4f4f4}.gallery{display:grid;
       grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
       gap:15px;
       padding:20px}.gallery img{width:100%;
       height:180px;
       object-fit:cover;
       border-radius:10px;
       transition:transform .3s}.gallery img:hover{transform:scale(1.08)}
    </style>
    </head>
    <body>
        <h1>Photo Gallery</h1>
        <div class="gallery"><img src="https://picsum.photos/id/1015/400/300"><img src="https://picsum.photos/id/1025/400/300"><img src="https://picsum.photos/id/1035/400/300"><img src="https://picsum.photos/id/1043/400/300"></div></body></html>
