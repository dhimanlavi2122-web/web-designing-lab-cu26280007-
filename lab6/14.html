<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Responsive Layout</title>
        <style>
             body{font-family:Arial;
             margin:0;background:#eee}.container{display:flex;
             gap:15px;
             padding:20px}.box{background:#5266a8;
             color:white;
             padding:40px;
             text-align:center;
             flex:1}@media(max-width:700px){.container{flex-direction:column}.box{padding:25px}}@media(min-width:701px) and (max-width:1000px){.box{background:#268b80}}
        </style>
    </head>
<body>
    <h1 style="text-align:center">Responsive Website</h1>
    <div class="container">
        <div class="box">Home</div>
        <div class="box">About</div><div class="box">Contact</div></div></body></html>
