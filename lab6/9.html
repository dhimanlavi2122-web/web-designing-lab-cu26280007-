<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Smooth Scroll</title>
        <style>
            html{scroll-behavior:smooth}
            body{font-family:Arial;margin:0}
            nav{position:sticky;top:0;background:#26345d;padding:18px;text-align:center}
            nav a{color:white;margin:15px;text-decoration:none}
            .section{height:400px;padding:40px;text-align:center}
            .section:nth-child(even){background:#eee}
        </style>
    </head>
    <body>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
        <section class="section" id="home">
            <h1>Home</h1>
        </section>
        <section class="section" id="about">
            <h1>About</h1>
        </section>
        <section class="section" id="contact">
            <h1>Contact</h1>
        </section>
    </body>
</html>
