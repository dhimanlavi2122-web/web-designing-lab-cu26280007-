<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Product Features</title>
        <style>
            body{font-family:Arial;background:#f4f6fa;text-align:center;padding:25px}
            .features{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
            .feature{background:white;padding:25px;width:210px;border-radius:10px;box-shadow:0 2px 8px #ddd}
            .icon{font-size:35px}
        </style>
    </head>
    <body>
        <h1>Our Features</h1>
        <div class="features">
            <div class="feature">
                <div class="icon">⚡</div>
                <h3>Fast</h3>
                <p>Quick performance.</p>
            </div>
            <div class="feature">
                <div class="icon">🔒</div>
                <h3>Secure</h3>
                <p>Your data is safe.</p>
            </div>
            <div class="feature">
                <div class="icon">📱</div>
                <h3>Responsive</h3>
                <p>Works on all screens.</p>
            </div>
        </div>
    </body>
</html>
