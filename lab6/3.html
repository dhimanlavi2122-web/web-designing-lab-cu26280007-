<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Hero Banner</title>
        <style>
            *{box-sizing:border-box}
            body{margin:0;
            font-family:Arial}.hero{min-height:100vh;
            background:linear-gradient(#0008,#0009),url('https://images.unsplash.com/photo-1498050108023-c5249f4df085') center/cover;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:white;
            padding:25px}.content{max-width:650px}h1{font-size:clamp(35px,7vw,65px);
            margin:10px}.btn{display:inline-block;
            background:#ffb703;
            color:#222;
            padding:13px 24px;
            border-radius:25px;
            text-decoration:none;
            font-weight:bold}
</style>
</head>
<body>
    <section class="hero">
        <div class="content">
            <h1>Welcome to My Portfolio</h1>
            <p>Creative ideas. Simple designs. Smart solutions.</p><a class="btn" href="#more">Explore More</a></div></section><p id="more" style="padding:30px">Thanks for visiting my portfolio.</p>
</body>
</html>
