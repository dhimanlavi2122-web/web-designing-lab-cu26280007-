<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            color: blue;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

<!-- Inline CSS -->
<h2 style="color: red;">Inline CSS Heading</h2>

<h2 class="internal">Internal CSS Heading</h2>

<p class="external">External CSS Paragraph</p>

</body>
</html>
