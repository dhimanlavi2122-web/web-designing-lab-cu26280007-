<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>
        table {
            width: 600px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: lightblue;
        }

        th {
            background-color: gray;
            color: white;
        }
    </style>
</head>

<body>

<h2>Student Details</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Lavisha</td>
        <td>MCA</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Ritika</td>
        <td>MCA</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Urvashi</td>
        <td>BCA</td>
    </tr>
</table>

</body>
</html>
