<!DOCTYPE html>
<html>
<head>
    <title>Newsletter</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
        }

        .box {
            position: relative;
            width: 350px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid gray;
        }

        label {
            position: absolute;
            left: 12px;
            top: 12px;
            background: white;
            padding: 0 5px;
            color: gray;
            transition: 0.3s;
        }

        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 13px;
            color: blue;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<h2>Subscribe to Newsletter</h2>

<div class="box">

    <input type="email" id="email" placeholder=" ">

    <label for="email">Enter your Email</label>

</div>

<button>Subscribe</button>

</body>
</html>
