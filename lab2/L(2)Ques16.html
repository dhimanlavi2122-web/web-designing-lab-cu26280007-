<!DOCTYPE html>
<html>
<head>
    <title>Employee Evaluation</title>

    <style>
        .form {
            width: 500px;
        }

        label {
            width: 150px;
            float: left;
            margin-bottom: 15px;
        }

        input, textarea {
            float: left;
            margin-bottom: 15px;
        }

        .clear {
            clear: both;
        }

        button {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h2>Employee Evaluation</h2>

<div class="form">

    <label>Employee Name:</label>
    <input type="text">

    <div class="clear"></div>

    <label>Department:</label>
    <input type="text">

    <div class="clear"></div>

    <label>Performance:</label>
    <input type="text">

    <div class="clear"></div>

    <label>Comments:</label>
    <textarea></textarea>

    <div class="clear"></div>

    <button>Submit</button>

</div>

</body>
</html>
