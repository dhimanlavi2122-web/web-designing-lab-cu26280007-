<!DOCTYPE html>
<html>
<head>
    <title>Typography</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        label {
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            font-family: Georgia;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 10px;
        }

        input::placeholder {
            text-transform: capitalize;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<h2>Registration Form</h2>

<form>

    <label>Name</label><br>
    <input type="text" placeholder="Enter your name">

    <br><br>

    <label>Email</label><br>
    <input type="email" placeholder="Enter your email">

</form>

</body>
</html>
