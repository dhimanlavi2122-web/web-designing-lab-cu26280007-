<!DOCTYPE html>
<html>
<head>
    <title>Search Box</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input {
            width: 150px;
            padding: 10px;
            border: 2px solid gray;
            transition: width 0.5s;
        }

        input:focus {
            width: 350px;
            border-color: blue;
            outline: none;
        }
    </style>
</head>

<body>

<h2>Search</h2>

<input type="text" placeholder="Search here...">

</body>
</html>
