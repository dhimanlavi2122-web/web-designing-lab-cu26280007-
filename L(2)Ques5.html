<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            background: #eee;
            font-family: Arial;
        }

        .card {
            width: 300px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Login</button>

</div>

</body>
</html>
