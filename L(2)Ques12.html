<!DOCTYPE html>
<html>
<head>
    <title>Payment Gateway</title>

    <style>
        body {
            font-family: Arial;
            background: #eee;
        }

        .payment {
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            background: white;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }

        @media (max-width: 600px) {
            .payment {
                width: 90%;
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

<div class="payment">

    <h2>Payment Checkout</h2>

    <input type="text" placeholder="Card Holder Name">

    <input type="text" placeholder="Card Number">

    <input type="month">

    <input type="password" placeholder="CVV">

    <button>Pay Now</button>

</div>

</body>
</html>
