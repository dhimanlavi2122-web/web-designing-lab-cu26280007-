<!DOCTYPE html>
<html>
<head>
    <title>Financial Report</title>
</head>
<body>
    <table border="1">
        <caption>Financial Report</caption>

        <thead>
            <tr>
                <th>Year</th>
                <th>Income</th>
                <th>Expenses</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>2024</td>
                <td>₹5,00,000</td>
                <td>₹3,00,000</td>
            </tr>

            <tr>
                <td>2025</td>
                <td>₹6,00,000</td>
                <td>₹3,50,000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total</th>
                <th>₹11,00,000</th>
                <th>₹6,50,000</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
