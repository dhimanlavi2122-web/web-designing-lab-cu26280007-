<!DOCTYPE html>
<html>
<head>
    <title>Rowspan Table</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="2">Lavisha</td>
            <td>HTML</td>
            <td>85</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>90</td>
        </tr>
    </table>
</body>
</html>
