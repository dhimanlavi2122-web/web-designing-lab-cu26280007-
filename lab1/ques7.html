<body>
    <h1>Steps to Make Tea</h1>

    <ol>
        <li>Boil water.</li>
        <li>Add tea leaves.</li>
        <li>Add sugar.</li>
        <li>Add milk.</li>
        <li>Boil for a few minutes.</li>
        <li>Strain the tea and serve.</li>
    </ol>
