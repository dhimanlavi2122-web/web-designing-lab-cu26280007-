<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        form {
            width: 350px;
            padding: 20px;
            border: 1px solid gray;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: green;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: darkgreen;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<h2>Upload File</h2>

<form>
    <label>Select File:</label>
    <input type="file">
    <br><br>

    <button type="submit">Upload</button>
</form>

</body>
</html>
