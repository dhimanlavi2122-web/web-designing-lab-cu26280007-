<!DOCTYPE html>
<html>
<head>
    <title>Range Slider</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input {
            margin: 10px;
        }
    </style>
</head>

<body>

<h2>Age Selection</h2>

<label>Age:</label>

<input type="range" min="1" max="100" value="20"
       oninput="age.value=this.value">

<output id="age">20</output> years

<br><br>

<label>Number:</label>

<input type="number" min="1" max="100" value="20">

</body>
</html>
