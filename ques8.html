    <title>Computer Science Glossary</title>

<body>
    <h1>Computer Science Terms</h1>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language used to create web pages.</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets used to style web pages.</dd>

        <dt>CPU</dt>
        <dd>Central Processing Unit of a computer.</dd>

        <dt>RAM</dt>
        <dd>Random Access Memory used for temporary storage.</dd>
    </dl>
</body>
