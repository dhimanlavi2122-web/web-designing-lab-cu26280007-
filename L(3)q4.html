<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>

<h2>Fibonacci Series</h2>

<script>
    let n = Number(prompt("Enter number of terms:"));

    // Using for loop
    let a = 0, b = 1;
    let resultFor = "";

    for (let i = 1; i <= n; i++) {
        resultFor += a + " ";
        let c = a + b;
        a = b;
        b = c;
    }

    document.write("<h3>Using For Loop:</h3>");
    document.write(resultFor);


    
    a = 0;
    b = 1;
    let i = 1;
    let resultWhile = "";

    while (i <= n) {
        resultWhile += a + " ";
        let c = a + b;
        a = b;
        b = c;
        i++;
    }

    document.write("<h3>Using While Loop:</h3>");
    document.write(resultWhile);


    
    a = 0;
    b = 1;
    i = 1;
    let resultDoWhile = "";

    if (n > 0) {
        do {
            resultDoWhile += a + " ";
            let c = a + b;
            a = b;
            b = c;
            i++;
        } while (i <= n);
    }

    document.write("<h3>Using Do-While Loop:</h3>");
    document.write(resultDoWhile);
</script>

</body>
</html>
